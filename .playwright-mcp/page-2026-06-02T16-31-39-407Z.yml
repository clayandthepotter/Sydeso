          - textbox "Generated design lock markdown" [ref=e69]: "# Workflow app Design Lock ## Visual intent Dense product surfaces with strong hierarchy and high trust. Tone: Calm editorial Density: Balanced Accent: Blue (#4c67f0) Motion: 160-200ms ## Foundation - Use neutral surfaces with one accent color. - Keep borders visible and shadows restrained. - Preserve a calm editorial hierarchy. ## Layout - Use a predictable grid and clear section rhythm. - Prefer compact surfaces for dense product work. - Leave enough whitespace for high-priority content. ## Components - Buttons should be crisp and low-noise. - Cards should feel like organized notes. - Inputs should be legible, calm, and accessible. ## Motion - Use 160-200ms transitions for hover and focus states. - Keep movement subtle and functional. ## Governance - Version the guide as an immutable artifact. - Use it for design approval, implementation, and QA. - Update the guide when the visual system changes."
