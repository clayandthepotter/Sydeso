name: Documentation
description: Propose updates to docs, wiki, or contributor guidance.
title: "docs: "
labels: ["documentation"]
body:
  - type: textarea
    id: target
    attributes:
      label: Target docs
      description: List files/pages that need updates.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Change needed
      description: What should be added/updated/removed?
    validations:
      required: true
  - type: dropdown
    id: audience
    attributes:
      label: Audience
      options:
        - Public contributors
        - Maintainers
        - Internal/private
        - Mixed
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we verify docs are complete and consistent?
    validations:
      required: true
