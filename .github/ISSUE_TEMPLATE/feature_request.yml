name: Feature Request
description: Propose a Sydeso feature or product improvement.
title: "feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or workflow problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe expected behavior and workflow impact.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - docs
        - design
        - web
        - api
        - db
        - workflow
        - artifacts
        - agents
        - runner
        - qa
        - release
        - infra
        - security
        - licensing
        - community
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Related phase
      options:
        - P1 Real App Foundation
        - P2 Artifact System
        - P3 Workflow Engine
        - P4 Agent Orchestration
        - P5 Runner Protocol
        - P6 Development Execution
        - P7 Automated QA
        - P8 Remediation Loop
        - P9 Human Review and Ready
        - P10 Productionization
        - Design System
        - Open Core Licensing
        - Documentation and Community
        - Unsure
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 Critical
        - P1 High
        - P2 Medium
        - P3 Low
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true for this to be complete?
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: Related docs
      description: List related docs paths to update (if known).
